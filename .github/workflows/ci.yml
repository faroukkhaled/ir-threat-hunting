name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m irforge simulate --out /tmp/intrusion.csv
      - run: python -m irforge hunt /tmp/intrusion.csv
      - run: python -m irforge report /tmp/intrusion.csv --format html --out /tmp/report.html
